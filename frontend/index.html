<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#5B21B6" />
    <!-- Light is the default; apply a saved "dark" choice before the first paint, so the page doesn't flash. -->
    <script>try{if(localStorage.getItem('samplecap_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
    <!-- Defaults; each public page replaces the data-seo tags with its own (prerendered, then by SeoManager). -->
    <meta name="description" content="%VITE_BRAND_DESCRIPTION%" data-seo />
    <!-- Modern typography with full Sinhala Unicode support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>%VITE_BRAND_TITLE_NAME% — %VITE_BRAND_TAGLINE%</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>%VITE_BRAND_NAME% creates Sinhala and English captions and subtitles for your videos. Please turn on JavaScript to use the app.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
