<!doctype html>
<!--
  Source of public/og-image.png (the 1200×630 link-preview image).
  Regenerate: node scripts/brand/og-image.mjs [domain]   e.g. node scripts/brand/og-image.mjs sinsub.lk
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&family=Noto+Sans+Sinhala:wght@700;800;900&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: Inter, "Noto Sans Sinhala", sans-serif;
    color: #1A1530;
    background:
      radial-gradient(circle at 0% 100%, rgba(249,115,22,.10), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(91,33,182,.08), transparent 50%),
      #FBF8F6;
  }
  .si { font-family: "Noto Sans Sinhala", sans-serif; }
  .bg-letters {
    position: absolute; right: -10px; top: 70px; width: 600px;
    font: 800 150px/1.05 "Noto Sans Sinhala", sans-serif;
    color: rgba(91,33,182,.07); word-break: break-all; text-align: right;
  }
  .logo { position: absolute; left: 80px; top: 70px; display: flex; align-items: center; gap: 10px; }
  .logo .mark { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 14px; background: #F97316; color: #fff; font: 900 30px/1 "Noto Sans Sinhala", sans-serif; letter-spacing: -0.04em; }
  .logo .word { font: 800 40px/1 Inter, sans-serif; letter-spacing: -1px; }
  h1 { position: absolute; left: 80px; top: 180px; margin: 0; width: 900px; font-size: 64px; font-weight: 800; line-height: 1.12; letter-spacing: -1px; }
  h1 .si { color: #6D28D9; }
  p { position: absolute; left: 80px; top: 365px; margin: 0; width: 840px; font-size: 26px; font-weight: 500; line-height: 1.45; color: #4A4560; }
  .chips { position: absolute; left: 80px; top: 490px; display: flex; gap: 14px; }
  .chips span { background: #1A1530; color: #fff; border-radius: 12px; padding: 14px 18px; font-size: 30px; font-weight: 800; line-height: 1; }
  .chips .on { background: #F97316; }
  .domain { position: absolute; right: 80px; top: 515px; font-size: 26px; font-weight: 800; color: #6D28D9; }
</style>
</head>
<body>
  <div class="bg-letters" aria-hidden="true">අආඇඉඋඑඔකගචජටඩතදනපබම</div>
  <div class="logo">
    <b class="mark">සිං</b>
    <span class="word">Sub</span>
  </div>
  <h1>Automatic <span class="si">සිංහල</span> &amp; English captions for your videos</h1>
  <p>Word-by-word timing, caption styles, SRT &amp; MP4 export, and an online video editor.</p>
  <div class="chips"><span class="si">අද</span><span class="si">අපි</span><span class="on">Toyota</span><span>Aqua</span><span>review</span></div>
  <div class="domain" id="domain">sinsub.cc</div>
  <script>
    const d = new URLSearchParams(location.search).get('domain');
    if (d) document.getElementById('domain').textContent = d;
  </script>
</body>
</html>
